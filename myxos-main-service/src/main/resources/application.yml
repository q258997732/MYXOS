server:
  port: 8080

spring:
  application:
    name: myxos-main-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.11.2.110}:3306/myxos?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

myxos:
  jwt:
    # JWT 签名密钥，必须通过环境变量 MYXOS_JWT_SECRET 注入，禁止硬编码
    secret: ${MYXOS_JWT_SECRET:}
    # 访问令牌有效期（毫秒），默认 2 小时
    expiration: 7200000
    # 刷新令牌有效期（毫秒），默认 7 天
    refresh-expiration: 604800000
  internal:
    # 主服务与采集服务内部通信共享令牌，必须通过环境变量注入
    token: ${MYXOS_INTERNAL_TOKEN:}

logging:
  level:
    bob.myxos: info
